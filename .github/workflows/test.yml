name: offline-dictionary-tests
on: [pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - run: python -m pip install --require-hashes -r tools/data_builder/requirements-windows.lock
      - run: python -m pytest tools/data_builder/tests -q
      - run: flutter pub get --enforce-lockfile
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.os }}
          path: evidence/
