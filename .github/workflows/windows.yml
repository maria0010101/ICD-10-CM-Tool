name: Windows portable build
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'schemas/**'
      - 'samples/**'
      - 'scripts/build_windows.ps1'
      - '.github/workflows/windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pinned standalone Python 3.13.18 (security-release runtime)
        shell: pwsh
        run: |
          $Archive = Join-Path $env:RUNNER_TEMP 'cpython-3.13.18-windows-x64.tar.gz'
          $Target = Join-Path $env:RUNNER_TEMP 'icd-python313'
          Invoke-WebRequest -Uri 'https://github.com/astral-sh/python-build-standalone/releases/download/20261026/cpython-3.13.18%2B20261026-x86_64-pc-windows-msvc-install_only_stripped.tar.gz' -OutFile $Archive
          if ((Get-FileHash $Archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '7369f7a35f261222a6ac8b3a87c1c88eeebee8af945d85346202591a64038dd3') { throw 'Python runtime SHA256 mismatch' }
          New-Item -ItemType Directory -Force $Target | Out-Null
          tar -xzf $Archive -C $Target
          if ($LASTEXITCODE -ne 0) { throw 'Python runtime extraction failed' }
          $PythonDir = Join-Path $Target 'python'
          $PythonDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & (Join-Path $PythonDir 'python.exe') --version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Locked builder dependencies and Python tests
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r tools/data_builder/requirements-windows.lock
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency install failed' }
          python -m pytest tools/data_builder/tests -q
          if ($LASTEXITCODE -ne 0) { throw 'Python tests failed' }
      - name: Analyze, native tests, release build and app-local CRT
        shell: pwsh
        run: |
          $Version = (Select-String '^version:\s*([0-9.]+)' app/pubspec.yaml).Matches[0].Groups[1].Value
          "APP_VERSION=$Version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & ./scripts/build_windows.ps1
      - name: Launch bundled executable on the hosted Windows runner
        shell: pwsh
        run: |
          $Bundle = Resolve-Path app/build/windows/x64/runner/Release
          $Process = Start-Process -FilePath (Join-Path $Bundle 'icd_dictionary.exe') -WorkingDirectory $Bundle -PassThru
          try {
            Start-Sleep -Seconds 8
            if ($Process.HasExited) { throw "Bundled app exited early: $($Process.ExitCode)" }
            $State = Join-Path $Bundle 'portable-data/user.sqlite'
            if (!(Test-Path $State)) { throw 'App failed to create its separate user database' }
            $Check = python -c "import json,sqlite3,pathlib,sys; c=sqlite3.connect(pathlib.Path(sys.argv[1]).resolve().as_uri()+'?mode=ro',uri=True); tables=[r[0] for r in c.execute('SELECT name FROM sqlite_master WHERE type=char(116,97,98,108,101)')]; assert {'installed_packages','favorites','personal_notes','preferences'} <= set(tables); assert c.execute('PRAGMA integrity_check').fetchone()[0]=='ok'; print(json.dumps(dict(tables=tables))); c.close()" $State
            if ($LASTEXITCODE -ne 0) { throw 'App-local SQLite startup validation failed' }
            @{ process_alive=$true; app_user_sqlite_verified=$true; app_user_tables=($Check | ConvertFrom-Json).tables; environment='GitHub hosted Windows runner, not a clean workstation'; timestamp=(Get-Date).ToUniversalTime().ToString('o'); commit=$env:GITHUB_SHA } | ConvertTo-Json | Set-Content evidence/windows-bundle-launch.json
          } finally { Stop-Process -Id $Process.Id -ErrorAction SilentlyContinue }
      - name: Preserve portable ZIP and native FTS5 query evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-portable-${{ env.APP_VERSION }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/*windows-x64.zip
            dist/*windows-x64.zip.sha256
            evidence/linux-probe.json
            evidence/pcs-native.json
            evidence/nhi-cm-native.json
            evidence/nhi2014-native.json
            evidence/guided-native.json
            evidence/tree-expanded.png
            evidence/windows-bundle-launch.json
