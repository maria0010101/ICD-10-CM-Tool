name: Windows portable build
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'schemas/**'
      - 'samples/**'
      - 'scripts/build_windows.ps1'
      - '.github/workflows/windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.18'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Locked builder dependencies and Python tests
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r tools/data_builder/requirements-windows.lock
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency install failed' }
          python -m pytest tools/data_builder/tests -q
          if ($LASTEXITCODE -ne 0) { throw 'Python tests failed' }
      - name: Analyze, native tests, release build and app-local CRT
        shell: pwsh
        run: |
          $Version = (Select-String '^version:\s*([0-9.]+)' app/pubspec.yaml).Matches[0].Groups[1].Value
          "APP_VERSION=$Version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & ./scripts/build_windows.ps1
      - name: Launch bundled executable on the hosted Windows runner
        shell: pwsh
        run: |
          $Bundle = Resolve-Path app/build/windows/x64/runner/Release
          $Process = Start-Process -FilePath (Join-Path $Bundle 'icd_dictionary.exe') -WorkingDirectory $Bundle -PassThru
          Start-Sleep -Seconds 8
          if ($Process.HasExited) { throw "Bundled app exited early: $($Process.ExitCode)" }
          @{ process_alive=$true; environment='GitHub hosted Windows runner, not a clean workstation'; timestamp=(Get-Date).ToUniversalTime().ToString('o'); commit=$env:GITHUB_SHA } | ConvertTo-Json | Set-Content evidence/windows-bundle-launch.json
          Stop-Process -Id $Process.Id
      - name: Preserve portable ZIP and native FTS5 query evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-portable-${{ env.APP_VERSION }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/*windows-x64-demo.zip
            dist/*windows-x64-demo.zip.sha256
            evidence/linux-probe.json
            evidence/windows-bundle-launch.json
